spring:
  application:
    name: votacao

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/votacao}
    username: ${DB_USERNAME:votacao}
    password: ${DB_PASSWORD:votacao}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

votacao:
  elegibilidade:
    # client fake da Tarefa Bônus 1; use 0 para desativar o sorteio
    probabilidade-cpf-invalido: ${ELEGIBILIDADE_PROB_CPF_INVALIDO:0.2}
    probabilidade-inelegivel: ${ELEGIBILIDADE_PROB_INELEGIVEL:0.2}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
